{% extends 'base.html' %}
{% block content %}
<div class="flex justify-between flex-wrap items-center pt-3 pb-2 mb-4 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900">Batch Capture Claims</h1>
</div>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

<div x-data="batchCapture()" class="bg-surface border border-gray-200 shadow-soft rounded-xl p-6">
    <div class="overflow-x-auto mb-4">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date of Service</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tariff Code</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ICD-10</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Billed Amount</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="(row, index) in rows" :key="index">
                    <tr>
                        <td class="px-4 py-2 whitespace-nowrap"><input type="date" x-model="row.service_date" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-accent focus:border-accent sm:text-sm"></td>
                        <td class="px-4 py-2 whitespace-nowrap"><input type="number" x-model="row.patient_id" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-accent focus:border-accent sm:text-sm" placeholder="Patient ID"></td>
                        <td class="px-4 py-2 whitespace-nowrap"><input type="text" x-model="row.tariff_code" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-accent focus:border-accent sm:text-sm" placeholder="Tariff Code"></td>
                        <td class="px-4 py-2 whitespace-nowrap"><input type="text" x-model="row.icd10" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-accent focus:border-accent sm:text-sm" placeholder="ICD-10"></td>
                        <td class="px-4 py-2 whitespace-nowrap"><input type="number" x-model="row.quantity" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-accent focus:border-accent sm:text-sm" value="1"></td>
                        <td class="px-4 py-2 whitespace-nowrap"><input type="number" step="0.01" x-model="row.billed_amount" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-accent focus:border-accent sm:text-sm" placeholder="0.00" @keydown.enter.prevent="addRow(index)"></td>
                        <td class="px-4 py-2 whitespace-nowrap"><button class="bg-red-500 text-white px-3 py-1 rounded-md hover:bg-red-600 transition-colors font-medium text-sm" @click="removeRow(index)" x-show="rows.length > 1">Remove</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    
    <div class="flex justify-between items-center mb-2">
        <button class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-200 transition-colors font-medium text-sm" @click="addRow(-1)">+ Add Row</button>
        <button class="bg-accent text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors font-medium text-sm" @click="submit" :disabled="isSubmitting">
            <span x-show="!isSubmitting">Submit Batch</span>
            <span x-show="isSubmitting">Submitting...</span>
        </button>
    </div>
        
    <div x-show="message" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mt-4" x-text="message"></div>
    <div x-show="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4" x-text="error"></div>
</div>

<script>
function batchCapture() {
    return {
        rows: [
            {service_date: '', patient_id: '', tariff_code: '', icd10: '', quantity: 1, billed_amount: ''}
        ],
        isSubmitting: false,
        message: '',
        error: '',
        addRow(index) {
            this.rows.splice(index + 1, 0, {service_date: '', patient_id: '', tariff_code: '', icd10: '', quantity: 1, billed_amount: ''});
            // Let Alpine update the DOM, then focus on the new row's first input (date of service)
            this.$nextTick(() => {
                const trs = document.querySelectorAll('tbody tr');
                if (trs.length > index + 1) {
                    const inputs = trs[index + 1].querySelectorAll('input');
                    if(inputs.length > 0) inputs[0].focus();
                }
            });
        },
        removeRow(index) {
            this.rows.splice(index, 1);
        },
        async submit() {
            this.isSubmitting = true;
            this.message = '';
            this.error = '';
            try {
                const response = await fetch("{% url 'claims:batch_capture' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({rows: this.rows})
                });
                const data = await response.json();
                if (response.ok) {
                    this.message = data.message;
                    this.rows = [{service_date: '', patient_id: '', tariff_code: '', icd10: '', quantity: 1, billed_amount: ''}];
                } else {
                    this.error = data.error || 'An error occurred';
                }
            } catch (err) {
                this.error = err.message;
            } finally {
                this.isSubmitting = false;
            }
        }
    }
}
</script>
{% endblock %}
