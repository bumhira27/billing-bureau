{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-3xl">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Upload Remittance File</h2>
    <div class="bg-surface border border-gray-200 shadow-soft rounded-xl p-6">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-6 flex gap-3">
                <button type="submit" class="bg-accent text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors font-medium">Upload and Process</button>
                <a href="{% url 'reconciliation:file_list' %}" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-200 transition-colors font-medium text-center">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
