{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h2>{% if form.instance.pk %}Edit Practice{% else %}Add Practice{% endif %}</h2>
<div class="card">
    <div class="card-body">
        {% crispy form %}
        <a href="{% url 'practices:list' %}" class="btn btn-secondary mt-3">Cancel</a>
    </div>
</div>
{% endblock %}
