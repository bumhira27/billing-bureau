{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Update Bureau Profile{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-surface border border-gray-200 shadow-soft rounded-xl overflow-hidden">
            <div class="bg-accent text-white px-6 py-4 border-b border-gray-200">
                <h4 class="m-0 text-lg font-semibold">Bureau Profile</h4>
            </div>
            <div class="p-6">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="mt-6 bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors font-medium flex items-center gap-2">
                        <i class="bi bi-save"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
