{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h2 class="text-2xl font-semibold text-gray-900 mb-6">Add Scheme for {{ view.kwargs.patient_id }}</h2>
<div class="bg-surface border border-gray-200 shadow-soft rounded-xl p-6">
    <div class="space-y-4">
        {% crispy form %}
        <a href="{% url 'patients:detail' view.kwargs.patient_id %}" class="inline-block mt-4 bg-gray-100 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-200 transition-colors font-medium">Cancel</a>
    </div>
</div>
{% endblock %}
