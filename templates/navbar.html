<header class="bg-surface border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-4">
        <!-- Mobile menu toggle would go here -->
        <h2 class="text-xl font-semibold text-gray-800 tracking-tight">{% block header_title %}Dashboard{% endblock %}</h2>
    </div>

    <div class="flex items-center gap-4">
        {% if request.user.is_authenticated %}
            <div class="text-sm font-medium text-gray-600">
                <i class="bi bi-person-circle mr-1"></i> {{ request.user.username }}
            </div>
            
            <form method="post" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
                    Logout
                </button>
            </form>
        {% endif %}
    </div>
</header>
