{% load i18n %}
<div class="flex items-center justify-between mt-6">
  {% if wizard.steps.prev %}
    <button name="wizard_goto_step" type="submit" value="{{ wizard.steps.first }}"
            class="text-gray-500 hover:text-gray-700 font-medium text-sm transition-colors">
      &larr; {% trans "Cancel" %}
    </button>
  {% else %}
    <div></div>
  {% endif %}

  <button type="submit" class="bg-accent hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition-colors shadow-sm">
    {% trans "Next" %} &rarr;
  </button>
</div>
