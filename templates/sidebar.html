<aside class="w-64 bg-primary text-gray-300 flex-shrink-0 hidden md:flex flex-col border-r border-gray-800">
    <div class="h-16 flex items-center px-6 border-b border-gray-800 bg-gray-900">
        <span class="text-lg font-bold text-white tracking-tight">Billing Bureau</span>
    </div>

    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-2 no-scrollbar">
        <!-- Core Navigation -->
        <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if request.path == '/' %}bg-accent text-white{% else %}hover:bg-gray-800 hover:text-white{% endif %}">
            <i class="bi bi-house-door"></i> Dashboard
        </a>

        <a href="{% url 'practices:list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if 'practices' in request.path %}bg-accent text-white{% else %}hover:bg-gray-800 hover:text-white{% endif %}">
            <i class="bi bi-building"></i> Practices
        </a>
        <a href="{% url 'patients:list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if 'patients' in request.path %}bg-accent text-white{% else %}hover:bg-gray-800 hover:text-white{% endif %}">
            <i class="bi bi-people"></i> Patients
        </a>
        <a href="{% url 'claims:list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if 'claims' in request.path %}bg-accent text-white{% else %}hover:bg-gray-800 hover:text-white{% endif %}">
            <i class="bi bi-file-text"></i> Claims
        </a>
        <a href="{% url 'reconciliation:dashboard' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if 'reconciliation' in request.path %}bg-accent text-white{% else %}hover:bg-gray-800 hover:text-white{% endif %}">
            <i class="bi bi-arrow-left-right"></i> Reconciliation
        </a>
        <a href="{% url 'billing_collections:financials' %}" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if 'collections' in request.path %}bg-accent text-white{% else %}hover:bg-gray-800 hover:text-white{% endif %}">
            <i class="bi bi-wallet2"></i> Collections
        </a>

        {% load role_tags %}
        {% if request.user.is_superuser or request.user|has_group:"BureauAdmin" %}
        <div class="pt-4 pb-1">
            <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">System</p>
        </div>
        <a href="/admin/" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors hover:bg-gray-800 hover:text-white">
            <i class="bi bi-gear"></i> Administration
        </a>
        {% endif %}
    </nav>
</aside>
